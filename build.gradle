buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'java'
apply plugin: 'kotlin'
apply plugin: "maven-publish"

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    maven { url "https://repo1.maven.org/maven2/" }
    maven { url "https://repo.clojars.org/" }
    maven { url "https://repository.hellonico.info/repository/hellonico/" }
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation group: 'origami', name: 'origami', version:'4.13.0-2-SNAPSHOT'
    implementation group: 'org.clojure', name: 'clojure', version:'1.11.3'
    implementation 'io.github.classgraph:classgraph:4.8.65'
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId "origami"
            artifactId "filters"
            version project.version
            from components.java
        }
    }

    repositories {
        maven {
            name "nexus"
            url "https://repository.hellonico.info/repository/hellonico/"
            credentials {
                username project.findProperty("mavenUser") ?: ""
                password project.findProperty("mavenPassword") ?: ""
            }
        }
    }
}

compileKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}
compileTestKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}

task generateDoc(type: JavaExec) {
    main = 'origami.FindFilters$GenerateDoc'
    classpath = sourceSets.main.runtimeClasspath
    args = ["../web-docs/filters","src/test/resources/marcel.png"]
}

task generateEdn(type: JavaExec) {
    main = 'origami.FindFilters$GenerateEdn'
    classpath = sourceSets.main.runtimeClasspath
    args = []
}

task bumpVersion {
    doLast {
        def propertiesFile = file('gradle.properties')
        def lines = propertiesFile.readLines().collect { line ->
            if (line.startsWith("version=")) {
                def currentVersion = line.replace("version=", "")
                def parts = currentVersion.split('\\.').collect { it.toInteger() }
                parts[parts.size() - 1] += 1 // Bump the patch version
                def newVersion = parts.join(".")
                println "Bumping version to $newVersion"
                return "version=$newVersion"
            }
            return line
        }
        propertiesFile.text = lines.join(System.lineSeparator())
    }
}
